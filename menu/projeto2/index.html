<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dodge 3D — Projeto 2</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #0b0f19;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  .navbar {
    flex: 0 0 auto;
  }

  #game-container {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
  }

  #game-container canvas {
    display: block;
  }

  .hud {
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0, 0, 0, .6);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(11, 15, 25, .85);
    text-align: center;
  }

  .mobile-controls {
    padding-bottom: calc(1rem + env(safe-area-inset-bottom)) !important;
  }

  .mobile-controls button {
    width: 64px;
    height: 64px;
    font-size: 1.5rem;
  }
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="../../index.html">&larr; Lab</a>
    <span class="navbar-text text-light">Dodge 3D</span>
  </div>
</nav>

<div id="game-container">
  <div class="hud position-absolute top-0 start-0 p-3 text-light">
    <div class="fs-5">Pontos: <span id="score">0</span></div>
  </div>

  <div id="start-screen" class="overlay">
    <div class="text-light">
      <h1 class="mb-3">Dodge 3D</h1>
      <p class="mb-1">Desvie dos obstáculos trocando de faixa.</p>
      <p class="mb-4 text-secondary small">Teclado: ← → ou A/D &nbsp;|&nbsp; Celular: botões abaixo</p>
      <button id="btn-start" class="btn btn-primary btn-lg">Iniciar</button>
    </div>
  </div>

  <div id="gameover-screen" class="overlay d-none">
    <div class="text-light">
      <h1 class="mb-3">Fim de jogo</h1>
      <p class="mb-4">Pontuação: <span id="final-score">0</span></p>
      <button id="btn-restart" class="btn btn-primary btn-lg">Jogar novamente</button>
    </div>
  </div>

  <div class="mobile-controls d-flex d-lg-none position-absolute bottom-0 start-0 end-0 p-3 justify-content-between">
    <button id="btn-left" class="btn btn-outline-light rounded-circle">&larr;</button>
    <button id="btn-right" class="btn btn-outline-light rounded-circle">&rarr;</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="game.js"></script>
</body>
</html>
